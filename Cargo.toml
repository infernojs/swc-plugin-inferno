[package]
authors       = ["Havunen <sampo.kivisto@live.fi>"]
description   = "SWC plugin for InfernoJS."
documentation = "https://github.com/infernojs/swc-plugin-inferno"
edition       = "2024"
include       = ["Cargo.toml", "src/**/*.rs"]
license       = "MIT"
name          = "swc-plugin-inferno"
repository    = "https://github.com/infernojs/swc-plugin-inferno.git"
rust-version  = "1.98"
version       = "3.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(swc_ast_unknown)'] }

[lib]
crate-type = ["cdylib", "rlib"]
bench = false


[profile.release]
# This removes more dead code
codegen-units = 1
lto = true
# Optimize for size
opt-level = "s"

# Strip debug symbols
strip = "symbols"

[dependencies]
base64       = "0.23.1"
rustc-hash   = "2.1.3"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
sha1         = "0.10"

swc_core = { version = "80", features = [
    "common",
    "ecma_ast",
    "ecma_plugin_transform",
    "ecma_utils",
    "ecma_visit",
] }

[dev-dependencies]
swc_ecma_codegen               = { version = "32" }
swc_ecma_parser                = { version = "45" }
swc_ecma_transforms_compat     = { version = "57", features = ["es3"] }
swc_ecma_transforms_testing    = { version = "53" }
swc_ecma_transforms_typescript = { version = "55" }
testing                        = { version = "27" }
