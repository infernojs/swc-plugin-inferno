name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # rust-toolchain.toml pins the toolchain and the wasm32-wasip1 target.
    # Do not override it here: the .wasm is only known-good for a verified
    # toolchain, and a miscompiled guest hangs instead of failing.
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  e2e:
    # Bundles real JSX through webpack + swc-loader using the wasm artifact.
    # `cargo test` exercises the transform as a native rlib, so it cannot catch
    # a broken wasm guest - which is how 2.16.0-2.16.2 shipped hanging.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - name: Build wasm plugin and run e2e
      run: npm run test:e2e
